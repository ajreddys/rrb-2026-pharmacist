<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Source for og-image.jpg (1200×630), editorial-poster style. Render with: marketing/src/render.sh -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;800&family=Instrument+Serif:ital@0;1&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#f3ead8;color:#161210;font-family:"Archivo",sans-serif;display:grid;grid-template-columns:690px 1fr;overflow:hidden}
.red{background:#b3121e;color:#f3ead8;padding:34px 40px;display:flex;flex-direction:column;justify-content:space-between}
.kick{font-weight:800;font-size:15px;letter-spacing:.16em;border-bottom:1px solid rgba(243,234,216,.45);padding-bottom:12px}
.big{font-family:"Anton";font-size:300px;line-height:.78;letter-spacing:-.02em;margin-top:6px}
h1{font-family:"Anton";font-weight:400;font-size:62px;line-height:.95;text-transform:uppercase}
.it{font-family:"Instrument Serif";font-style:italic;font-size:34px;margin-top:6px}
.side{padding:34px 40px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:14px;border-bottom:3px solid #161210;padding-bottom:16px}
.brand img{width:56px;height:56px;border-radius:50%;background:#fff;padding:3px;border:1px solid #161210}
.brand b{font-family:"Anton";font-size:30px;letter-spacing:.04em;font-weight:400}
.row{display:flex;flex-direction:column;gap:2px;border-bottom:1px solid #cfc2a8;padding-bottom:12px}
.row small{font-weight:800;font-size:13px;letter-spacing:.16em}
.row b{font-family:"Anton";font-weight:400;font-size:52px;line-height:1}
.row b.r{color:#b3121e}
.row em{font-family:"Instrument Serif";font-size:24px;color:#5e554a}
.url{margin-top:auto;background:#161210;color:#f3ead8;font-weight:800;font-size:20px;letter-spacing:.06em;padding:14px 18px;text-align:center}
</style>
</head>
<body>
  <div class="red">
    <div class="kick">RRB · CEN 05/2026 · PHARMACIST BATCH</div>
    <div class="big">118</div>
    <div><h1>Pharmacist posts.<br>One CBT. One RRB.</h1><p class="it">Rank inside them, with Pharmakaksha.</p></div>
  </div>
  <div class="side">
    <div class="brand"><img src="../../logo.jpg" alt=""><b>PHARMAKAKSHA</b></div>
    <div class="row"><small>INTRODUCTORY OFFER</small><b class="r">TRY DAY 1 FREE</b></div>
    <div class="row"><small>FEE FROM</small><b>₹1,999 <em>· registrations close 31 Oct</em></b></div>
    <div class="url">RRB2026.PHARMAKAKSHA.COM</div>
  </div>
</body>
