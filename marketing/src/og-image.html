<style>

body{width:1200px;height:630px;background:#f5f7fb;color:#14213a;font-family:"Source Sans 3",sans-serif;padding:36px 52px;display:flex;flex-direction:column;gap:30px;overflow:hidden}

.trial b{font:800 38px/1.05 "Bricolage Grotesque";letter-spacing:-.02em}
.box{width:158px;background:#fff;border:1.5px solid #d7deea;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.box small{font:600 13px "IBM Plex Mono";letter-spacing:.12em;text-transform:uppercase;color:#56627a}
.box b{font:800 34px/1 "Bricolage Grotesque"}
.box.ok{width:230px;background:#e3f1e9;border-color:#a9d4bb}

    <div class="box"><small>Fee from</small><b>₹1,999</b></div>
    <div class="box ok"><small>Registrations close</small><b>31 Oct</b></div>
