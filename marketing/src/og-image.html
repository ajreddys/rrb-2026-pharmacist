<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Source for og-image.jpg (1200×630), departure-board style. Render with: marketing/src/render.sh -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#0a0b0d;color:#ebe7df;font-family:"JetBrains Mono",monospace;padding:34px 48px;display:flex;flex-direction:column;gap:30px;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:16px}
.brand img{width:62px;height:62px;border-radius:50%;background:#fff;padding:3px}
.brand b{display:block;font-weight:800;font-size:25px;letter-spacing:.06em}
.brand span{font-size:16px;color:#9a9ea6}
.url{background:#3ddc84;color:#04130a;font-weight:800;font-size:19px;padding:13px 20px;border-radius:8px}
.board{background:#121417;border:1px solid #33383f;border-radius:14px;overflow:hidden}
.head{background:#000;display:flex;justify-content:space-between;padding:11px 24px;font-weight:700;font-size:15px;letter-spacing:.16em;color:#9a9ea6;border-bottom:1px solid #33383f}
.head .live{color:#3ddc84}
.body{padding:30px 24px;display:flex;flex-direction:column;gap:16px}
.flaps{display:flex;gap:14px;flex-wrap:wrap}
.w{display:flex;gap:4px}
.f{width:37px;height:52px;display:grid;place-items:center;font-weight:800;font-size:36px;border-radius:5px;background:linear-gradient(#24282d 0 49.5%,#050607 49.5% 50.5%,#1b1e22 50.5%)}
.amber .f{color:#ffb400}
.row{display:flex;gap:14px;height:150px}
.cell{background:#121417;border:1px solid #33383f;border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.cell small{font-weight:700;font-size:13px;letter-spacing:.16em;color:#9a9ea6}
.cell b{font-weight:800;font-size:44px;color:#ffb400}
.trial{flex:1;background:#ffb400;color:#111;border:0}
.trial small{color:#5a3e00}
.trial b{color:#111;font-size:52px}
.ok b{color:#3ddc84}
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><img src="../../logo.jpg" alt=""><div><b>PHARMAKAKSHA</b><span>Learn · Grow · Achieve</span></div></div>
    <div class="url">rrb2026.pharmakaksha.com</div>
  </div>
  <div class="board">
    <div class="head"><span>RRB · CEN 05/2026 · PARAMEDICAL</span><span class="live">● PHARMACIST BATCH · LIVE</span></div>
    <div class="body" id="b"></div>
  </div>
  <div class="row">
    <div class="cell trial"><small>INTRODUCTORY OFFER</small><b>TRY DAY 1 FREE</b></div>
    <div class="cell"><small>FARE FROM</small><b>₹1,999</b></div>
    <div class="cell ok"><small>REGISTRATIONS CLOSE</small><b>31 OCT</b></div>
  </div>
<script>
const tiles = (t, cls) => `<div class="flaps ${cls}">` + t.split(" ").map(w => `<span class="w">${[...w].map(c => `<span class="f">${c}</span>`).join("")}</span>`).join("") + `</div>`;
document.getElementById("b").innerHTML = tiles("CRACK THE RRB PHARMACIST CBT", "") + tiles("RANK INSIDE THE 118", "amber");
</script>
</body>
</html>
